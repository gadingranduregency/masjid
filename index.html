<!DOCTYPE html>
<html>
<head>
  <base href="/masjid/">
  <meta name="theme-color" content="#D4AF37">
  <meta name="msapplication-navbutton-color" content="#D4AF37">
  <meta name="apple-mobile-web-app-status-bar-style" content=""#D4AF37">
  <link rel="manifest" href="manifest.json">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Masjid Sabilul Amanah - Ikhtisar Kas Kegiatan + Jadwal Shalat Kemenag WIB + Adzan Otomatis PWA">
  <meta name="theme-color" content="#0B3D2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SABILUL AMANAH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>SABILUL AMANAH</title>
  <script>const serviceWorkerVersion = "1821889381";</script>
  <script src="flutter.js" defer></script>
  <style>
  #pwaBanner{display:none;position:fixed;bottom:20px;left:12px;right:12px;background:#0B3D2E;border:1.5px solid #D4AF37;border-radius:16px;padding:12px 14px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.35);align-items:center;gap:12px}
  #pwaBanner.show{display:flex}
  #pwaInstallBtn{flex:1;background:#D4AF37;color:#0B3D2E;border:0;padding:10px 16px;border-radius:20px;font-weight:800}
  #pwaCloseBtn{background:transparent;border:0;color:#D4AF37;font-size:20px;padding:4px 8px}
</style>

<div id="pwaBanner">
  <img src="icons/Icon-192.png" width="32" height="32" style="border-radius:8px">
  <div style="flex:1">
    <div style="color:#fff;font-weight:700;font-size:13px">SABILUL AMANAH</div>
    <div style="color:#D4AF37;font-size:11px">Pasang aplikasi + Adzan otomatis</div>
  </div>
  <button id="pwaInstallBtn">Pasang</button>
  <button id="pwaCloseBtn">✕</button>
</div>
</head>
<body>
  <audio id="adzanAudio" src="assets/assets/adzan.mp3" preload="auto"></audio>
  <button id="pwaInstallBtn">INSTALL APLIKASI</button>

  <script>
    window.addEventListener('load', function() {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: serviceWorkerVersion },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) { appRunner.runApp(); });
        }
      });
    });

    // === PWA INSTALL HANDLER ===
    let deferredPrompt;
    const installBtn = document.getElementById('pwaInstallBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      installBtn.style.display = 'none';
      if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }
    });
    window.addEventListener('appinstalled', ()=>{ installBtn.style.display='none'; console.log('PWA installed'); });

    // === ADZAN BUNYI + NOTIF - CUMA KALAU INSTALL PWA ===
    function isPWA() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || document.referrer.includes('android-app://');
    }
    async function initAdzanPWA() {
      if (!isPWA()) { console.log('Browser biasa - Adzan OFF'); return; }
      if (!('Notification' in window)) return;
      console.log('PWA Installed - Adzan ON');
      if (Notification.permission !== 'granted') {
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') return;
      }
      scheduleAdzan();
    }
    async function scheduleAdzan() {
      try {
        const audio = document.getElementById('adzanAudio');
        const today = new Date();
        const res = await fetch(`https://api.myquran.com/v2/sholat/jadwal/1632/${today.getFullYear()}/${String(today.getMonth()+1).padStart(2,'0')}/${String(today.getDate()).padStart(2,'0')}`);
        const j = (await res.json()).data.jadwal;
        const list = [
          {n:'Subuh', t:j.subuh}, {n:'Dzuhur', t:j.dzuhur}, {n:'Ashar', t:j.ashar}, {n:'Maghrib', t:j.maghrib}, {n:'Isya', t:j.isya}
        ];
        list.forEach(item => {
          const [h,m] = item.t.split(':').map(Number);
          let target = new Date(today.getFullYear(), today.getMonth(), today.getDate(), h, m, 0);
          if (target < today) target.setDate(target.getDate()+1);
          setTimeout(() => {
            audio.play().catch(()=>{});
            new Notification(`Waktu ${item.n} - Probolinggo`, {
              body: `Masuk waktu ${item.n} ${item.t} WIB - SABILUL AMANAH`,
              icon: 'icons/Icon-512.png',
              badge: 'icons/Icon-192.png',
              requireInteraction: true
            });
          }, target - today);
        });
        const tomorrow = new Date(today.getFullYear(), today.getMonth(), today.getDate()+1, 0, 5, 0) - today;
        setTimeout(scheduleAdzan, tomorrow);
      } catch(e){ console.log('jadwal error', e); }
    }
    window.addEventListener('load', () => setTimeout(initAdzanPWA, 2500));
  </script>
<script>
  let deferredPrompt;
  const banner = document.getElementById('pwaBanner');
  const installBtn = document.getElementById('pwaInstallBtn');
  const closeBtn = document.getElementById('pwaCloseBtn');

  // cek kalau user pernah close, jangan munculin lagi 1 hari
  if(localStorage.getItem('pwaBannerClosed') && Date.now() - localStorage.getItem('pwaBannerClosed') < 86400000){
    // jangan tampil
  } else {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      banner.classList.add('show');
    });
  }

  installBtn.addEventListener('click', async () => {
    banner.classList.remove('show');
    if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }
  });

  closeBtn.addEventListener('click', () => {
    banner.classList.remove('show');
    localStorage.setItem('pwaBannerClosed', Date.now());
  });

  window.addEventListener('appinstalled', ()=> banner.classList.remove('show'));
</script>
</body>
</html>
